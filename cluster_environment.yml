# conda environment for cluster_kaden_4fish_voltage_rule.py
#   conda env create -f cluster_environment.yml
# numpy >= 2 is required: Kaden's mask pickles reference numpy._core and do not load with numpy 1.x.
name: electric_fish
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib
